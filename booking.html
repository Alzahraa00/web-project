<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Study Rooms</a></li>
            <li><a href="booking.html" class="active">Booking</a></li>
            <li><a href="my-bookings.html">My Bookings / About Us</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="booking-container">
        <h1>Booking Form</h1>
        
        <form action="#" method="POST" class="booking-form">
            
            <fieldset>
                <legend>Student Information</legend>
                
                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input type="text" id="student-name" name="student_name" required>
                </div>

                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" name="student_id" required>
                </div>

                <div class="form-group">
                    <label for="student-email">University Email</label>
                    <input type="email" id="student-email" name="student_email" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Booking Details</legend>

                <div class="form-group">
                    <label for="room-select">Select Room</label>
                    <select id="room-select" name="room_selection" required>
                        <option value="">-- Select --</option>
                        <option value="room-a">Room A</option>
                        <option value="room-b">Room B</option>
                        <option value="room-c">Room C</option>
                        <option value="room-d">Room D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="booking-date">Date</label>
                    <input type="date" id="booking-date" name="booking_date" required>
                </div>

                <div class="form-group">
                    <label for="start-time">Start Time</label>
                    <input type="time" id="start-time" name="start_time" required>
                </div>

                <div class="form-group">
                    <label for="duration">Duration (Hours)</label>
                    <input type="number" id="duration" name="duration" min="1" max="4" required>
                </div>

                <div class="form-group">
                    <label for="students-count">Number of Students</label>
                    <input type="number" id="students-count" name="students_count" min="1" max="8" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Requirements</legend>

                <div class="form-group checkboxes">
                    <label><input type="checkbox" name="services[]" value="whiteboard"> Whiteboard</label>
                    <label><input type="checkbox" name="services[]" value="screen"> Display Screen</label>
                    <label><input type="checkbox" name="services[]" value="power_sockets"> Power Sockets</label>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Submit</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>

        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Study Room Booking System</p>
</footer>
